name: Ontology Documentation CI

on:
  push:
    branches:
      - master

concurrency:
  group: geosparql-pages
  cancel-in-progress: false

jobs:
  buildnext:
    name: Compile GeoSPARQL Next
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ github.token }}
          submodules: true

      - name: Build specification doc using Metanorma
        run: |
          docker run --rm \
            -v "$PWD/geosparql-next/spec:/metanorma" \
            -w /metanorma \
            metanorma/metanorma \
            metanorma compile --agree-to-terms -t ogc -x html document.adoc
          mkdir -p site/geosparql-next
          cp geosparql-next/spec/document.html site/geosparql-next/spec.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build ontology documentation
        run: |
          python -m pip install --upgrade pip pylode
          # ontologies
          echo "Making Ontology HTML"
          pylode geosparql-next/rdf/ontologies/geo.ttl -o site/geosparql-next/ont.html -p ontpub
          echo "Making SF Geoms Ontology HTML"
          pylode geosparql-next/rdf/ontologies/sf_geometries.ttl -o site/geosparql-next/sf_geometries.html -p ontpub
          # vocabularies
          echo "Making Egenhofer vocab HTML"
          pylode geosparql-next/rdf/vocabularies/egenhofer.ttl -o site/geosparql-next/egenhofer.html -p vocpub
          echo "Making Functions vocab HTML"
          pylode geosparql-next/rdf/vocabularies/functions.ttl -o site/geosparql-next/functions.html -p vocpub
          echo "Making Geocoding vocab HTML"
          pylode geosparql-next/rdf/vocabularies/geocoding.ttl -o site/geosparql-next/geocoding.html -p vocpub
          echo "Making RCC8 vocab HTML"
          pylode geosparql-next/rdf/vocabularies/rcc8.ttl -o site/geosparql-next/rcc8.html -p vocpub
          echo "Making RCC9 vocab HTML"
          pylode geosparql-next/rdf/vocabularies/rcc9.ttl -o site/geosparql-next/rcc9.html -p vocpub
          echo "Making Requirements vocab HTML"
          pylode geosparql-next/rdf/vocabularies/requirements.ttl -o site/geosparql-next/requirements.html -p vocpub
          echo "Making Rules vocab HTML"
          pylode geosparql-next/rdf/vocabularies/rules.ttl -o site/geosparql-next/rules.html -p vocpub
          echo "Making SA Funcs vocab HTML"
          pylode geosparql-next/rdf/vocabularies/safuncs.ttl -o site/geosparql-next/safuncs.html -p vocpub
          echo "Making SF vocab HTML"
          pylode geosparql-next/rdf/vocabularies/sf.ttl -o site/geosparql-next/sf.html -p vocpub
          echo "Completed RDF -> HTML"
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          clean: true
          folder: site/geosparql-next
          target-folder: geosparql-next

  docco:
    name: Publish docco
    needs: buildnext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
            token: ${{ github.token }}
            ref: master
            submodules: true
      - name: Prepare static page
        run: |
          mkdir site
          cp docco/index.html site/index.html
          touch site/.nojekyll
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          clean: true
          clean-exclude: geosparql-next
          folder: site/
