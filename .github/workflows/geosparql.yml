name: Ontology Documentation CI

on: 
  push: 
      branches: 
          - master
          - geosparql-1.1
          - geosparql-1.0
          - geosparql-n
          - 13buildingblocks

jobs:
  buildnext:
    name: Compile GeoSPARQL Next
    runs-on: ubuntu-latest
    needs: docco
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ github.token }}
          ref: master
          submodules: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Build specification
        run: |
          gem install asciidoctor asciidoctor-pdf --no-document
          mkdir -p site/geosparql-next
          asciidoctor \
            -o site/geosparql-next/spec.html \
            geosparql-next/spec/document.adoc
          asciidoctor-pdf \
            -o site/geosparql-next/spec.pdf \
            geosparql-next/spec/document.adoc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build ontology documentation
        run: |
          python -m pip install --upgrade pip pylode
          pylode \
            geosparql-next/rdf/ontologies/geo.ttl \
            -o site/geosparql-next/ont.html \
            -p ontpub

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          clean: false
          folder: site/

  docco:
    name: Publish docco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
            token: ${{ github.token }}
            ref: master
            submodules: true
      - name: Prepare static page
        run: |
          mkdir site
          cp docco/index.html site/index.html
          touch site/.nojekyll
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          clean: true
          folder: site/
